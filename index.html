
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gorewhore.com - Khrista's Bday</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #0d0000;
      color: #ff3333;
      overflow-x: hidden;
      user-select: none;
    }

    /* --- PANTALLA 1: INICIO --- */
    #screen1 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('https://i.pinimg.com/originals/09/1c/3c/091c3c517f8e9b43f2933cd80b898939.gif') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 1s ease-in-out;
    }

    .warning-gif {
      max-width: 80%;
      max-height: 50vh;
      border: 2px solid #800000;
      box-shadow: 0 0 15px #ff0000;
      margin-bottom: 25px;
    }

    .enter-btn {
      background: #3a0000;
      color: #ff0000;
      border: 3px solid #ff0000;
      padding: 15px 40px;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 5px;
      cursor: pointer;
      text-shadow: 0 0 5px #ff0000;
      box-shadow: 0 0 10px #800000;
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: #ff0000;
      color: #000;
      box-shadow: 0 0 25px #ff0000;
      transform: scale(1.1);
    }

    /* --- PANTALLA 2: PRINCIPAL --- */
    #screen2 {
      display: none;
      opacity: 0;
      min-height: 100vh;
      background: url('https://i.pinimg.com/vwebp/736x/a2/8c/a1/a28ca1f13132b630c23a9ae1b9fc662c.webp') repeat;
      transition: opacity 1s ease-in-out;
      padding-bottom: 80px;
    }

    .header-bar {
      background: #110000;
      border-bottom: 2px solid #660000;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 10px #000;
    }

    .header-title {
      color: #ff0000;
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #000, 0 0 10px #ff0000;
    }

    .main-container {
      max-width: 1100px;
      margin: 20px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 0 15px;
    }

    /* Lado Izquierdo - Reproductor */
    .left-column {
      flex: 2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .player-box {
      background: #000;
      border: 2px solid #800000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      padding: 10px;
    }

    .main-display-img {
      width: 100%;
      height: 400px;
      object-fit: contain;
      background: #050505;
      display: block;
      border: 1px solid #333;
    }

    .banner-gif {
      width: 100%;
      height: auto;
      display: block;
      border: 2px solid #800000;
      box-shadow: 0 0 10px #3a0000;
    }

    /* Lado Derecho - Miniaturas */
    .right-column {
      flex: 1;
      min-width: 250px;
      background: rgba(10, 0, 0, 0.85);
      border: 2px solid #550000;
      padding: 15px;
      display: flex;
      flex-direction: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
    }

    .right-column h3 {
      color: #ff4d4d;
      font-size: 1.1rem;
      border-bottom: 1px red dashed;
      padding-bottom: 5px;
      text-align: center;
    }

    .thumb-item {
      display: flex;
      gap: 10px;
      background: #1a0000;
      border: 1px solid #400000;
      padding: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .thumb-item:hover {
      background: #400000;
      border-color: #ff0000;
    }

    .thumb-item img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border: 1px solid #ff0000;
    }

    .thumb-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 0.8rem;
      color: #ccc;
    }

    /* DECORACIONES DECORATIVAS */
    .deco-bat {
      position: fixed;
      bottom: 10px;
      left: 10px;
      width: 90px;
      pointer-events: none;
      z-index: 50;
    }

    .deco-cat {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 90px;
      pointer-events: none;
      z-index: 50;
    }

    /* --- POP-UP WEB --- */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: #1a0000;
      border: 3px solid #ff0000;
      box-shadow: 0 0 25px #ff0000;
      width: 320px;
      padding: 15px;
      text-align: center;
      position: relative;
      animation: popIn 0.4s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .popup-header {
      background: #ff0000;
      color: #000;
      font-weight: bold;
      padding: 3px;
      margin: -15px -15px 15px -15px;
      font-size: 0.9rem;
    }

    .popup-btn {
      margin-top: 15px;
      background: #ff0000;
      color: #000;
      border: none;
      padding: 8px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .popup-btn:hover {
      background: #fff;
    }

    /* --- SCREAMER VIDEO SCREEN --- */
    #screamer-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }

    #screamer-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* EFECTO GLITCH/ERROR */
    .glitch-active {
      animation: flashError 0.1s infinite;
    }

    @keyframes flashError {
      0% { background-color: red; filter: invert(100%); }
      50% { background-color: black; filter: invert(0%); }
      100% { background-color: darkred; }
    }
  </style>
</head>
<body>

  <div id="screen1">
    <img src="https://i.pinimg.com/originals/71/49/3f/71493f6fda021c55b82c2e42a0887209.gif" alt="Warning" class="warning-gif">
    <button class="enter-btn" onclick="enterSite()">ENTER</button>
  </div>

  <div id="screen2">
    <div class="header-bar">
      <h1 class="header-title">gorewhore.com</h1>
    </div>

    <div class="main-container">
      <div class="left-column">
        <div class="player-box">
          <img id="mainViewer" src="kc.jpeg" alt="Khrista Photo" class="main-display-img">
        </div>
        <img src="https://i.pinimg.com/originals/e9/5f/61/e95f6113b20646cc773f23a56c70a610.gif" class="banner-gif" alt="Horror Gif">
      </div>

      <div class="right-column">
        <h3>MORE_FILES_</h3>

        <div class="thumb-item" onclick="changeImage('kc.jpeg')">
          <img src="kc.jpeg" alt="kc">
          <div class="thumb-info">
            <strong>khrista_01.jpg</strong>
            <span>View Photo</span>
          </div>
        </div>

        <div class="thumb-item" onclick="changeImage('kcc.jpeg')">
          <img src="kcc.jpeg" alt="kcc">
          <div class="thumb-info">
            <strong>khrista_02.jpg</strong>
            <span>View Photo</span>
          </div>
        </div>

        <div class="thumb-item" onclick="changeImage('kccc.jpeg')">
          <img src="kccc.jpeg" alt="kccc">
          <div class="thumb-info">
            <strong>khrista_03.jpg</strong>
            <span>View Photo</span>
          </div>
        </div>

        <div class="thumb-item" onclick="changeImage('ck.jpe')">
          <img src="ck.jpe" alt="ck">
          <div class="thumb-info">
            <strong>khrista_04.jpg</strong>
            <span>View Photo</span>
          </div>
        </div>
      </div>
    </div>

    <img src="https://i.pinimg.com/originals/a7/dc/06/a7dc06235cbbcdec007dfed58146265e.gif" class="deco-bat" alt="Murciélago">
    <img src="https://i.pinimg.com/originals/72/93/93/7293934821795dbe7206aa3cb1beaea5.gif" class="deco-cat" alt="Gatito Zombie">
  </div>

  <div id="popUp" class="popup-overlay">
    <div class="popup-box">
      <div class="popup-header">SYSTEM WARNING !</div>
      <p style="color: #fff; font-size: 0.9rem;">CRITICAL ERROR: Unexpected file detected on server.</p>
      <button class="popup-btn" onclick="triggerScream()">FIX ERROR</button>
    </div>
  </div>

  <div id="screamer-container">
    <video id="screamer-video" preload="auto">
      <source src="scream.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    function enterSite() {
      const s1 = document.getElementById('screen1');
      const s2 = document.getElementById('screen2');

      s1.style.opacity = '0';
      setTimeout(() => {
        s1.style.display = 'none';
        s2.style.display = 'block';
        setTimeout(() => {
          s2.style.opacity = '1';
          schedulePopup();
        }, 50);
      }, 1000);
    }

    function changeImage(src) {
      document.getElementById('mainViewer').src = src;
    }

    function schedulePopup() {
      // Aparece la notificación pop-up automáticamente después de 4 segundos
      setTimeout(() => {
        document.getElementById('popUp').style.display = 'flex';
      }, 4000);
    }

    function triggerScream() {
      document.getElementById('popUp').style.display = 'none';
      document.body.classList.add('glitch-active');

      // Efecto de parpadeo/error rápido antes del susto
      setTimeout(() => {
        document.body.classList.remove('glitch-active');
        const container = document.getElementById('screamer-container');
        const video = document.getElementById('screamer-video');
        
        container.style.display = 'block';
        video.play();

        // Al finalizar el video, oculta la pantalla de susto
        video.onended = function() {
          container.style.display = 'none';
        };
      }, 700);
    }
  </script>
</body>
</html>
