```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khrista's Birthday</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      background-color: #000;
      color: #8b0000;
    }

    /* PANTALLAS */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
    }

    /* PANTALLA 1 */
    #screen1 {
      z-index: 10;
      background: url("https://i.pinimg.com/originals/09/1c/3c/091c3c517f8e9b43f2933cd80b898939.gif") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
    }

    #screen1 .warning-gif {
      max-width: 80%;
      max-height: 40vh;
      border: 2px solid #8b0000;
      box-shadow: 0 0 15px #ff0000;
    }

    .enter-btn {
      background: #000;
      color: #ff0000;
      border: 3px solid #8b0000;
      padding: 15px 40px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px #8b0000, inset 0 0 10px #8b0000;
      transition: all 0.3s ease;
      font-family: 'Courier New', Courier, monospace;
    }

    .enter-btn:hover {
      background: #8b0000;
      color: #000;
      border-color: #ff0000;
      box-shadow: 0 0 25px #ff0000, inset 0 0 15px #000;
      transform: scale(1.08);
      text-shadow: 0 0 5px #000;
    }

    /* PANTALLA 2 */
    #screen2 {
      z-index: 5;
      opacity: 0;
      visibility: hidden;
      background: url("https://i.pinimg.com/vwebp/736x/a2/8c/a1/a28ca1f13132b630c23a9ae1b9fc662c.webp") no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    /* ESTADO OCULTO PANTALLA 1 */
    #screen1.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* ESTADO VISIBLE PANTALLA 2 */
    #screen2.visible {
      opacity: 1;
      visibility: visible;
    }

    /* DECORACIONES PANTALLA 2 */
    .decor {
      position: absolute;
      user-select: none;
      pointer-events: none;
    }

    /* Murciélago - Abajo Izquierda */
    .bat {
      bottom: 10px;
      left: 10px;
      width: 150px;
      max-width: 30vw;
    }

    /* Gatito zombie - Abajo Derecha */
    .zombie-cat {
      bottom: 10px;
      right: 10px;
      width: 140px;
      max-width: 30vw;
    }

    /* Gato bailando - Lado izquierdo a media altura */
    .dancing-cat {
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      width: 120px;
      max-width: 25vw;
    }

    /* ESTILO EMO/GÓTICO CONTAINER PRINCIPAL (VACÍO POR AHORA PARA FUTURO CONTENIDO) */
    .myspace-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 600px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #8b0000;
      box-shadow: 0 0 20px #8b0000;
      text-align: center;
      color: #ff3333;
    }

    .myspace-header {
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #000, 0 0 10px #ff0000;
    }

    .myspace-divider {
      height: 2px;
      background: #8b0000;
      margin: 15px 0;
      box-shadow: 0 0 5px #ff0000;
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1 (INICIO) -->
  <div id="screen1" class="screen">
    <img src="https://i.pinimg.com/originals/71/49/3f/71493f6fda021c55b82c2e42a0887209.gif" alt="Warning" class="warning-gif">
    <button class="enter-btn" onclick="enterSite()">ENTER</button>
  </div>

  <!-- PANTALLA 2 (PRINCIPAL) -->
  <div id="screen2" class="screen">
    
    <!-- Contenedor central MySpace/SpaceHey estilo gótico -->
    <div class="myspace-container">
      <h1 class="myspace-header">Happy Birthday Khrista</h1>
      <div class="myspace-divider"></div>
      <p style="letter-spacing: 1px;">🖤 Welcome to the dark side... 🖤</p>
    </div>

    <!-- GIFS DECORATIVOS -->
    <!-- Murciélago (Abajo izquierda) -->
    <img src="https://i.pinimg.com/originals/b2/3b/ce/b23bce7e6a41d84ca9af8b94d5b18d8f.gif" alt="Murciélago" class="decor bat">

    <!-- Gatito zombie (Abajo derecha) -->
    <img src="https://i.pinimg.com/originals/44/06/b4/4406b49c3a5106982f83456c0cb21475.gif" alt="Gatito Zombie" class="decor zombie-cat">

    <!-- Gato bailando (Lado izquierdo, media altura) -->
    <img src="https://i.pinimg.com/originals/3c/45/24/3c45240cd8253a92249373e385b7a492.gif" alt="Gato Bailando" class="decor dancing-cat">

  </div>

  <script>
    function enterSite() {
      const s1 = document.getElementById('screen1');
      const s2 = document.getElementById('screen2');

      s1.classList.add('hidden');
      s2.classList.add('visible');
    }
  </script>
</body>
</html>
