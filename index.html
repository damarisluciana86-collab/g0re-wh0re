<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khrista's Birthday</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Courier New', Courier, monospace;
      background-color: #000;
      color: #8b0000;
    }

    /* PANTALLAS */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 100vh;
      transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
    }

    /* PANTALLA 1 */
    #screen1 {
      z-index: 10;
      background: url("https://i.pinimg.com/originals/09/1c/3c/091c3c517f8e9b43f2933cd80b898939.gif") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      height: 100vh;
    }

    #screen1 .warning-gif {
      width: 320px;
      max-width: 85vw;
      border: 3px solid #8b0000;
      box-shadow: 0 0 20px #ff0000;
    }

    .enter-btn {
      background: #000;
      color: #ff0000;
      border: 3px solid #8b0000;
      padding: 18px 50px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 5px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px #8b0000, inset 0 0 10px #8b0000;
      transition: all 0.3s ease;
      font-family: 'Courier New', Courier, monospace;
    }

    .enter-btn:hover {
      background: #8b0000;
      color: #000;
      border-color: #ff0000;
      box-shadow: 0 0 30px #ff0000, inset 0 0 15px #000;
      transform: scale(1.1);
      text-shadow: 0 0 5px #000;
    }

    /* PANTALLA 2 */
    #screen2 {
      z-index: 5;
      opacity: 0;
      visibility: hidden;
      background: url("https://i.pinimg.com/vwebp/736x/a2/8c/a1/a28ca1f13132b630c23a9ae1b9fc662c.webp") no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 40px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    /* ESTADO OCULTO PANTALLA 1 */
    #screen1.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* ESTADO VISIBLE PANTALLA 2 */
    #screen2.visible {
      opacity: 1;
      visibility: visible;
    }

    /* DECORACIONES PANTALLA 2 */
    .decor {
      position: fixed;
      user-select: none;
      pointer-events: none;
      z-index: 20;
    }

    /* Murciélago - Abajo Izquierda */
    .bat {
      bottom: 20px;
      left: 20px;
      width: 260px;
      max-width: 38vw;
    }

    /* Gatito zombie - Abajo Derecha */
    .zombie-cat {
      bottom: 20px;
      right: 20px;
      width: 230px;
      max-width: 35vw;
    }

    /* GIF Nuevo (Lado izquierdo) */
    .new-gif {
      top: 45%;
      left: 25px;
      transform: translateY(-50%);
      width: 220px;
      max-width: 32vw;
    }

    /* ESTILO MYSPACE / GALLERY CONTAINER */
    .myspace-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 550px;
      padding: 25px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #8b0000;
      box-shadow: 0 0 25px #8b0000, 0 0 10px #000;
      text-align: center;
      color: #ff3333;
      margin-top: 20px;
      margin-bottom: 40px;
    }

    .myspace-header {
      font-size: 30px;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #000, 0 0 12px #ff0000;
    }

    .myspace-divider {
      height: 2px;
      background: #8b0000;
      margin: 15px 0 25px 0;
      box-shadow: 0 0 8px #ff0000;
    }

    /* GALERÍA DE FOTOS ESTILO INSTAGRAM (1:1 CUADRADAS) */
    .photo-gallery {
      display: flex;
      flex-direction: column;
      gap: 35px;
      align-items: center;
      width: 100%;
    }

    .insta-post {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      border: 2px solid #8b0000;
      background: #000;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .insta-post:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px #ff0000;
    }

    .insta-post img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ESTILO ANUNCIO / NOTIFICACIÓN POP-UP (ck.jpeg) */
    .ad-popup {
      width: 100%;
      max-width: 460px;
      background: #111;
      border: 3px double #ff0000;
      box-shadow: 0 0 25px #ff0000, inset 0 0 10px #8b0000;
      margin: 20px 0;
      padding: 8px;
      position: relative;
      animation: pulse-ad 2s infinite alternate;
    }

    .ad-header {
      background: #8b0000;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .ad-close-btn {
      background: #000;
      color: #ff0000;
      border: 1px solid #ff0000;
      padding: 0 5px;
      cursor: default;
      font-weight: bold;
    }

    .ad-body {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid #8b0000;
    }

    .ad-body img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ad-footer {
      font-size: 11px;
      color: #ff3333;
      text-transform: uppercase;
      margin-top: 6px;
      letter-spacing: 2px;
      text-align: center;
    }

    @keyframes pulse-ad {
      0% { box-shadow: 0 0 15px #8b0000; }
      100% { box-shadow: 0 0 30px #ff0000; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1 (INICIO) -->
  <div id="screen1" class="screen">
    <img src="https://i.pinimg.com/originals/71/49/3f/71493f6fda021c55b82c2e42a0887209.gif" alt="Warning" class="warning-gif">
    <button class="enter-btn" onclick="enterSite()">ENTER</button>
  </div>

  <!-- PANTALLA 2 (PRINCIPAL CON FOTOS Y MÚSICA) -->
  <div id="screen2" class="screen">
    
    <!-- Contenedor central MySpace / Galería -->
    <div class="myspace-container">
      <h1 class="myspace-header">Happy Birthday Khrista</h1>
      <div class="myspace-divider"></div>
      <p style="letter-spacing: 1px; margin-bottom: 25px;">🖤 Welcome to the dark side... 🖤</p>

      <!-- PUBLICACIONES TIPO INSTAGRAM -->
      <div class="photo-gallery">
        <div class="insta-post">
          <img src="kc.jpeg" alt="Khrista 1">
        </div>
        <div class="insta-post">
          <img src="kcc.jpeg" alt="Khrista 2">
        </div>

        <!-- FOTO ck.jpeg TRANSFORMADA EN ANUNCIO / NOTIFICACIÓN -->
        <div class="ad-popup">
          <div class="ad-header">
            <span>⚠️ SPONSORED AD / NOTIFICATION</span>
            <span class="ad-close-btn">X</span>
          </div>
          <div class="ad-body">
            <img src="ck.jpeg" alt="Anuncio Khrista">
          </div>
          <div class="ad-footer">
            --- CLICK TO SPONSOR KHRISTA ---
          </div>
        </div>

        <div class="insta-post">
          <img src="kccc.jpeg" alt="Khrista 3">
        </div>
        <div class="insta-post">
          <img src="kkc.jpeg" alt="Khrista 5">
        </div>
      </div>

    </div>

    <!-- GIFS DECORATIVOS -->
    <!-- Murciélago (Abajo izquierda) -->
    <img src="https://i.pinimg.com/originals/b2/3b/ce/b23bce7e6a41d84ca9af8b94d5b18d8f.gif" alt="Murciélago" class="decor bat">

    <!-- Gatito zombie (Abajo derecha) -->
    <img src="https://i.pinimg.com/originals/44/06/b4/4406b49c3a5106982f83456c0cb21475.gif" alt="Gatito Zombie" class="decor zombie-cat">

    <!-- GIF Nuevo (Lado izquierdo) -->
    <img src="https://i.pinimg.com/originals/48/dd/9e/48dd9e50b3c7be0dbf161a82c45bcede.gif" alt="GIF Nuevo" class="decor new-gif">

  </div>

  <!-- REPRODUCTOR DE AUDIO DIRECTO (RESPALDO FUNCIONAL) -->
  <audio id="music-player" loop preload="auto">
    <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/tracks/f35U0LpDq8x7I2jY.mp3" type="audio/mpeg">
  </audio>

  <script>
    function enterSite() {
      const s1 = document.getElementById('screen1');
      const s2 = document.getElementById('screen2');
      const player = document.getElementById('music-player');

      s1.classList.add('hidden');
      s2.classList.add('visible');

      // Reproducción inmediata sin anuncios
      player.play().catch(function(error) {
        console.log("Error al reproducir audio:", error);
      });
    }
  </script>
</body>
</html>
