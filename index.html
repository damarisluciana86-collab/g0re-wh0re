<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gorewhore.com - Khrista's Bday</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #0d0000;
      color: #ff3333;
      overflow-x: hidden;
      user-select: none;
    }

    /* --- PANTALLA 1: INICIO --- */
    #screen1 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('https://i.pinimg.com/originals/09/1c/3c/091c3c517f8e9b43f2933cd80b898939.gif') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 1s ease-in-out;
    }

    .warning-gif {
      max-width: 80%;
      max-height: 50vh;
      border: 2px solid #800000;
      box-shadow: 0 0 15px #ff0000;
      margin-bottom: 25px;
    }

    .enter-btn {
      background: #3a0000;
      color: #ff0000;
      border: 3px solid #ff0000;
      padding: 15px 40px;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 5px;
      cursor: pointer;
      text-shadow: 0 0 5px #ff0000;
      box-shadow: 0 0 10px #800000;
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: #ff0000;
      color: #000;
      box-shadow: 0 0 25px #ff0000;
      transform: scale(1.1);
    }

    /* --- PANTALLA 2: PRINCIPAL --- */
    #screen2 {
      display: none;
      opacity: 0;
      min-height: 100vh;
      background: url('https://i.pinimg.com/vwebp/736x/a2/8c/a1/a28ca1f13132b630c23a9ae1b9fc662c.webp') repeat;
      transition: opacity 1s ease-in-out;
      padding-bottom: 120px;
    }

    .header-bar {
      background: #110000;
      border-bottom: 2px solid #660000;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 10px #000;
    }

    .header-title {
      color: #ff0000;
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #000, 0 0 10px #ff0000;
    }

    .main-container {
      max-width: 1100px;
      margin: 20px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 0 15px;
    }

    /* Lado Izquierdo - Reproductor */
    .left-column {
      flex: 2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .player-box {
      background: #000;
      border: 3px solid #ff0000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      padding: 5px;
      position: relative;
    }

    .main-display-img {
      width: 100%;
      height: 400px;
      object-fit: cover; /* Completa todo el marco sin dejar espacios vacíos */
      background: #050505;
      display: block;
    }

    /* Ícono overlay de reproductor de video (Estilo YouTube) */
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65px;
      height: 65px;
      background: rgba(170, 0, 0, 0.75);
      border: 2px solid #ff0000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      box-shadow: 0 0 15px #ff0000;
    }

    .play-overlay::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid #ffffff;
      margin-left: 4px;
    }

    .banner-gif {
      width: 100%;
      height: auto;
      display: block;
      border: 2px solid #800000;
      box-shadow: 0 0 10px #3a0000;
    }

    /* Lado Derecho - Miniaturas */
    .right-column {
      flex: 1;
      min-width: 250px;
      background: rgba(10, 0, 0, 0.85);
      border: 2px solid #550000;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
    }

    .right-column h3 {
      color: #ff4d4d;
      font-size: 1.1rem;
      border-bottom: 1px red dashed;
      padding-bottom: 5px;
      text-align: center;
    }

    .thumb-item {
      display: flex;
      gap: 10px;
      background: #1a0000;
      border: 1px solid #400000;
      padding: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .thumb-item:hover {
      background: #400000;
      border-color: #ff0000;
    }

    .thumb-item img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border: 1px solid #ff0000;
    }

    .thumb-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 0.8rem;
      color: #ccc;
    }

    /* DECORACIONES */
    .deco-bat {
      position: fixed;
      bottom: 0px;
      left: 0px;
      width: 110px;
      pointer-events: none;
      z-index: 50;
    }

    .deco-cat {
      position: fixed;
      bottom: 0px;
      right: 0px;
      width: 260px; /* Gatito Zombie súper grande */
      pointer-events: none;
      z-index: 50;
    }

    /* --- POP-UP WEB --- */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: #1a0000;
      border: 3px solid #ff0000;
      box-shadow: 0 0 25px #ff0000;
      width: 320px;
      padding: 15px;
      text-align: center;
      position: relative;
      animation: popIn 0.4s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .popup-header {
      background: #ff0000;
      color: #000;
      font-weight: bold;
      padding: 3px;
      margin: -15px -15px 15px -15px;
      font-size: 0.9rem;
    }

    .popup-btn {
      margin-top: 15px;
      background: #ff0000;
      color: #000;
      border: none;
      padding: 8px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .popup-btn:hover {
      background: #fff;
    }

    /* --- SCREAMER IMAGE CONTAINER --- */
    #screamer-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }

    #screamer-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* EFECTO GLITCH/ERROR */
    .glitch-active {
      animation: flashError 0.1s infinite;
    }

    @keyframes flashError {
      0% { background-color: red; filter: invert(100%); }
      50% { background-color: black; filter: invert(0%); }
      100% { background-color: darkred; }
    }
  </style>
</head>
<body>

  <!-- AUDIOS -->
  <audio id="bgMusic" src="TikVid.io_7653536705982582024 (1).mp3" loop></audio>
  <audio id="screamSound" src="TikVid.io_7561542774567226654.mp3" preload="auto"></audio>

  <!-- PANTALLA 1 -->
  <div id="screen1">
    <img src="https://i.pinimg.com/originals/71/49/3f/71493f6fda021c55b82c2e42a0887209.gif" alt="Warning" class="warning-gif">
    <button class="enter-btn" onclick="enterSite()">ENTER</button>
  </div>

  <!-- PANTALLA 2 -->
  <div id="screen2">
    <div class="header-bar">
      <h1 class="header-title">gorewhore.com</h1>
    </div>

    <div class="main-container">
      <!-- LADO IZQUIERDO -->
      <div class="left-column">
        <div class="player-box">
          <img id="mainViewer" src="kc.jpeg" alt="Khrista Photo" class="main-display-img">
          <div class="play-overlay"></div>
        </div>
        <img src="https://i.pinimg.com/originals/e9/5f/61/e95f6113b20646cc773f23a56c70a610.gif" class="banner-gif" alt="Horror Gif">
      </div>

      <!-- LADO DERECHO (ESTILO YOUTUBE) -->
      <div class="right-column">
        <h3>MORE_FILES_</h3>

        <div class="thumb-item" onclick="changeImage('kc.jpeg')">
          <img src="kc.jpeg" alt="kc">
          <div class="thumb-info">
            <strong>khrista_01.jpg</strong>
            <span>▶ Play Video</span>
          </div>
        </div>

        <div class="thumb-item" onclick="changeImage('kcc.jpeg')">
          <img src="kcc.jpeg" alt="kcc">
          <div class="thumb-info">
            <strong>khrista_02.jpg</strong>
            <span>▶ Play Video</span>
          </div>
        </div>

        <div class="thumb-item" onclick="changeImage('kccc.jpeg')">
          <img src="kccc.jpeg" alt="kccc">
          <div class="thumb-info">
            <strong>khrista_03.jpg</strong>
            <span>▶ Play Video</span>
          </div>
        </div>

        <div class="thumb-item" onclick="changeImage('ck.jpeg')">
          <img src="ck.jpeg" alt="ck">
          <div class="thumb-info">
            <strong>khrista_04.jpg</strong>
            <span>▶ Play Video</span>
          </div>
        </div>
      </div>
    </div>

    <!-- DECORACIONES -->
    <img src="https://i.pinimg.com/originals/a7/dc/06/a7dc06235cbbcdec007dfed58146265e.gif" class="deco-bat" alt="Murciélago">
    <img src="https://i.pinimg.com/originals/72/93/93/7293934821795dbe7206aa3cb1beaea5.gif" class="deco-cat" alt="Gatito Zombie">
  </div>

  <!-- POP-UP WEB -->
  <div id="popUp" class="popup-overlay">
    <div class="popup-box">
      <div class="popup-header">SYSTEM WARNING !</div>
      <p style="color: #fff; font-size: 0.9rem;">CRITICAL ERROR: Unexpected file detected on server.</p>
      <button class="popup-btn" onclick="triggerScream()">FIX ERROR</button>
    </div>
  </div>

  <!-- SCREAMER IMAGE CONTAINER -->
  <div id="screamer-container">
    <img id="screamer-image" src="monchicara.jpeg" alt="Screamer">
  </div>

  <script>
    function enterSite() {
      const s1 = document.getElementById('screen1');
      const s2 = document.getElementById('screen2');
      const music = document.getElementById('bgMusic');

      music.play();

      s1.style.opacity = '0';
      setTimeout(() => {
        s1.style.display = 'none';
        s2.style.display = 'block';
        setTimeout(() => {
          s2.style.opacity = '1';
          schedulePopup();
        }, 50);
      }, 1000);
    }

    function changeImage(src) {
      document.getElementById('mainViewer').src = src;
    }

    function schedulePopup() {
      // El pop-up aparece a los 3 minutos (180,000 milisegundos)
      setTimeout(() => {
        document.getElementById('popUp').style.display = 'flex';
      }, 180000);
    }

    function triggerScream() {
      const music = document.getElementById('bgMusic');
      const screamSound = document.getElementById('screamSound');
      const container = document.getElementById('screamer-container');

      music.pause(); // Detiene la música de fondo

      document.getElementById('popUp').style.display = 'none';
      document.body.classList.add('glitch-active');

      setTimeout(() => {
        document.body.classList.remove('glitch-active');
        container.style.display = 'block';
        
        // Reproduce el audio de susto
        screamSound.play();

        // Cuando el audio de susto termina, desaparece la foto y vuelve la música
        screamSound.onended = function() {
          container.style.display = 'none';
          music.play();
        };
      }, 700);
    }
  </script>
</body>
</html>
