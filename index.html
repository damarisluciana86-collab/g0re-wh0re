<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(#ffd6e7,#fff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.carta{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
    width:80%;
    max-width:500px;
}

h1{
    color:#ff4f8b;
}

p{
    font-size:18px;
    color:#555;
}

button{
    margin-top:20px;
    background:#ff4f8b;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}
</style>

</head>

<body>

<div class="carta">

<h1>🎂 ¡Feliz Cumpleaños!</h1>

<p>
Aquí irá el nombre de tu amiga.
</p>

<p>
Este es el comienzo de una sorpresa hecha con mucho cariño. ❤️
</p>

<button onclick="alert('¡Te quiero muchísimo! ❤️')">
Abrir sorpresa
</button>

</div>

</body>
</html>
